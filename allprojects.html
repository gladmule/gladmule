<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALL PROJECTS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ultra&family=Playfair+Display:wght@900&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: "DSEG7";
      src: url("https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2")
        format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1.25rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: "Times New Roman", Times, serif;
      color: black;
      background: white;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-weight: 900;
      font-size: clamp(1.5rem, 5vw, 3rem);
      margin: 0 0 3rem;
      text-decoration: underline;
      text-underline-offset: 0.2em;
    }

    .projects {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
      max-width: 100%;
    }

    a {
      color: black;
      text-decoration: none;
      max-width: 100%;
    }

    a:hover,
    a:focus-visible {
      background: black;
      color: white;
    }

    .jammed {
      font-family: "Times New Roman", Times, serif;
      font-size: clamp(2rem, 8vw, 5rem);
    }

    .pazzo {
      font-family: "Ultra", Georgia, serif;
      font-size: clamp(1.8rem, 7vw, 4.5rem);
      letter-spacing: 0.05em;
    }

    .dualheat {
      display: inline-block;
      line-height: 1;
      padding: 0.5rem;
    }

    .dualheat .the {
      display: block;
      font-family: "Playfair Display", serif;
      font-size: clamp(0.8rem, 2vw, 1rem);
      font-weight: 900;
      letter-spacing: 0.4em;
      padding-left: 0.4em;
      margin-bottom: 0.6rem;
    }

    .dualheat .dual {
      display: block;
      font-family: "Playfair Display", serif;
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
    }

    .dualheat .heat {
      display: block;
      font-family: "DSEG7", monospace;
      font-size: clamp(2.5rem, 10vw, 4.2rem);
      font-weight: 700;
      margin-top: 0.4rem;
    }
  </style>
</head>

<body>

  <h1>ALL PROJECTS</h1>

  <nav class="projects" aria-label="All projects">

    <a class="pazzo" href="https://pazzoprod.com">
      PAZZOPROD
    </a>

    <a class="jammed" href="https://jammeddoor.com">
      JAMMED DOOR
    </a>

    <a class="dualheat" href="https://thedualheat.com"
       aria-label="The Dual Heat">
      <span class="the" aria-hidden="true">THE</span>
      <span class="dual" aria-hidden="true">DUAL</span>
      <span class="heat" aria-hidden="true">HEAt</span>
    </a>

  </nav>

</body>
</html>
