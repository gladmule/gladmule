<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALL PROJECTS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ultra&family=Rubik+Mono+One&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1.25rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      color: black;
      background: white;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.5rem, 5vw, 3rem);
      margin: 0 0 3rem;
    }

    .projects {
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    a {
      color: black;
      text-decoration: none;
    }

    a:hover {
      background: black;
      color: white;
    }

    .jammed {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 8vw, 5rem);
    }

    .pazzo {
      font-family: "Ultra", Georgia, serif;
      font-size: clamp(1.8rem, 7vw, 4.5rem);
      letter-spacing: 0.05em;
    }

    .dualheat {
      font-family: "Rubik Mono One", monospace;
      font-size: clamp(1.4rem, 6vw, 4rem);
      letter-spacing: 0.05em;
    }
  </style>
</head>

<body>

  <h1>ALL PROJECTS</h1>

  <nav class="projects">
    <a class="jammed" href="https://jammeddoor.com">JAMMED DOOR</a>
    <a class="pazzo" href="https://pazzoprod.com">PAZZOPROD</a>
    <a class="dualheat" href="https://thedualheat.com">THE DUAL HEAT</a>
  </nav>

</body>
</html>
